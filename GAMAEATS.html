<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GAMAEATS</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23043b5c'/%3E%3Ccircle cx='16' cy='18' r='8' fill='%23ffd100'/%3E%3Cpath d='M9 17h14M12 11v3M16 10v4M20 11v3' stroke='%23043b5c' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== LOADING SCREEN ===== -->
  <div id="loader" aria-hidden="true">
    <div class="loader-body">
      <div class="loader-stage">
        <span class="loader-ring"></span><span class="loader-ring"></span><span class="loader-ring"></span>
        <img class="loader-logo" src="https://i.ibb.co.com/mVt734Hd/image-2026-11-14-204832191.png" alt="">
      </div>
      <div class="loader-foot">
        <span>Tunggu Mas<span class="dots"></span></span>
        <div class="loader-bar"><i></i></div>
      </div>
    </div>
  </div>

  <!-- ===== AUDIO CONTROLS ===== -->
  <button id="soundBtn" type="button" aria-label="Mute sound" aria-pressed="false">
    <svg class="icon-on" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    <svg class="icon-off" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m16 9 6 6M22 9l-6 6"/></svg>
  </button>
  <input id="volumeSlider" type="range" min="0" max="100" aria-label="Volume">

  <!-- ===== FRONT HOME SCREEN ===== -->
  <section id="home">
    <img class="hero-bg" src="https://i.ibb.co.com/fzZfbfws/GAMADA-LAPAR-1.png" alt="Balairung UGM" onerror="this.style.display='none'">

    <svg class="geo geo-tl" id="geoTopLeft" viewBox="0 0 180 300" aria-hidden="true"></svg>
    <svg class="geo geo-tr" id="geoTopRight" viewBox="0 0 180 300" aria-hidden="true"></svg>
    <svg class="geo geo-bl" id="geoBotLeft" viewBox="0 0 240 420" aria-hidden="true"></svg>
    <svg class="geo geo-br" id="geoBotRight" viewBox="0 0 240 420" aria-hidden="true"></svg>

    <div class="home-center">
      <h1 class="home-title">GAMADA LAPAR?</h1>

      <div class="mascot-wrap">
        <img
          class="mascot-img"
          src="https://i.ibb.co.com/P8FT7T1/simaster-hungry-1.png"
          alt="Hungry Gamada Mascot"
          onerror="this.style.display='none'; document.getElementById('mascotFallback').hidden=false;"
        >
        <svg id="mascotFallback" hidden width="210" height="230" viewBox="0 0 210 230" fill="none">
          <rect x="58" y="114" width="94" height="78" rx="26" fill="#f7d2b5" stroke="#043b5c" stroke-width="3.2"/>
          <path d="M58 164h94v22c0 10-8 18-18 18H76c-10 0-18-8-18-18v-22Z" fill="#b8292f" stroke="#043b5c" stroke-width="3.2"/>
          <path d="M58 160h94v10H58z" fill="#4a5568" stroke="#043b5c" stroke-width="2.5"/>
          <circle cx="105" cy="176" r="16" fill="#ffd100" stroke="#043b5c" stroke-width="3"/>
          <path d="M74 116c18 14 44 14 62 0" stroke="#ffd100" stroke-width="7" stroke-linecap="round"/>
          <path d="M74 116c18 14 44 14 62 0" stroke="#043b5c" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M58 124c-16 12-22 30-16 44 4 8 14 8 18 0l8-18" fill="#f7d2b5" stroke="#043b5c" stroke-width="3.2" stroke-linecap="round"/>
          <path d="M152 124c16 12 20 32 6 42-10 7-26 5-36 2" fill="#f7d2b5" stroke="#043b5c" stroke-width="3.2" stroke-linecap="round"/>
          <rect x="64" y="48" width="82" height="68" rx="22" fill="#f7d2b5" stroke="#043b5c" stroke-width="3.2"/>
          <circle cx="88" cy="82" r="11" fill="#ffffff" stroke="#043b5c" stroke-width="2.5"/>
          <circle cx="122" cy="82" r="11" fill="#ffffff" stroke="#043b5c" stroke-width="2.5"/>
          <circle cx="88" cy="84" r="4.5" fill="#043b5c"/>
          <circle cx="122" cy="84" r="4.5" fill="#043b5c"/>
          <path d="M77 78h22M111 78h22" stroke="#043b5c" stroke-width="3" stroke-linecap="round"/>
          <path d="M94 102c7-3 15-3 22 0" stroke="#043b5c" stroke-width="2.8" stroke-linecap="round"/>
          <polygon points="105,14 26,42 105,56 184,42" fill="#2d3748" stroke="#043b5c" stroke-width="3.2" stroke-linejoin="round"/>
          <path d="M105 36c34 2 56 10 62 34" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
          <path d="M167 70l-5 14h10l-5-14Z" fill="#ffd100" stroke="#043b5c" stroke-width="2.2"/>
        </svg>
      </div>

      <a class="browse-btn" href="#foods">
        BROWSE
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
      </a>
    </div>
  </section>

  <!-- ===== FOODS & CATEGORIES VIEW ===== -->
  <section id="foods" hidden>
    <header class="top">
      <a class="logo" href="#home"><span class="brand-dot"></span>GAMAEATS</a>
      <a class="pill" href="#home">Home</a>
    </header>
    <div class="intro">
      <h2>What are you craving?</h2>
      <p>Select a category bar to inspect student-budget spots around campus.</p>
    </div>
    <div id="cats"></div>
  </section>

  <script src="script.js"></script>
</body>
</html>
